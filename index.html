<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f6f8">
    <title>Interview Prep Studio</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app" id="appRoot" data-page="dashboard">
        <header class="topbar">
            <a class="brand" href="index.html" aria-label="Interview Prep Studio dashboard">
                <span class="brandmark" aria-hidden="true">IP</span>
                <span>Interview Prep Studio<small>LEARN · LISTEN · PRACTICE</small></span>
            </a>
            <div class="top-actions">
                <button class="icon-btn" id="themeToggle" type="button" aria-label="Toggle theme"
                    title="Toggle theme">◐</button>
            </div>
        </header>
        <main class="shell">
            <div class="section-head">
                <div>
                    <h1>Choose a technology</h1>
                    <p>Select a card to open its interview practice page.</p>
                </div>
                <input class="search" id="techSearch" type="search" placeholder="Search technologies…"
                    aria-label="Search technologies">
            </div>
            <div class="status" id="technologyStatus" role="status" aria-live="polite">Loading technologies…</div>
            <section class="tech-grid row row-cols-2 row-cols-md-3 row-cols-xl-4 row-cols-xxl-6 g-4 mx-0"
                id="techGrid" aria-label="Technology cards"></section>
        </main>
    </div>
    <script type="module" src="js/app.js"></script>
</body>
</html>
